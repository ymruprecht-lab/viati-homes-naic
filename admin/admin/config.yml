backend:
  name: git-gateway
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
    - name: "pages"
    label: "Edit Text Images"
    files:
            - file: "content/hero.yml"
        label: "Hero - Community Garden Village"
        fields:
                    - {label: "Title", name: "title", widget: "string", default: "Community Garden Village sa puso ng Nature Township"}
                    - {label: "Price", name: "price", widget: "string", default: "6.6K/MONTH VIA PAG-IBIG"}
                    - {label: "Phone", name: "phone", widget: "string", default: "0955 550 1300"}
